name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist on the repo)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: sms-notifier.exe
          - os: macos-latest
            artifact: sms-notifier

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-build"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTC_WRAPPER: sccache

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error

  upload:
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          merge-multiple: true

      - name: Generate release.md from template
        run: |
          version=$(echo "${{ steps.tag.outputs.name }}" | sed 's/^v//')
          sed -e "s|VERSION|$version|g" ./.github/release_notes.md > release.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: ./dist/*
          body_path: './release.md'
